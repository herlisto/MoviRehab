name: movirehab
description: "MoviRehab - Aplicación de ejercicios de movilidad y rehabilitación articular (Proyecto 5)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  # Persistencia SQLite (Bloque C)
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # Permisos de cámara y micrófono (pantalla Ajustes y Permisos)
  permission_handler: ^13.0.2

  # Estado (Bloque A)
  provider: ^6.1.1

  # Paquete de componentes visuales propios (Bloque D)
  movirehab_components:
    path: ./packages/movirehab_components
  material_color_utilities: ^0.13.0
  test_api: ^0.7.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
