name: movirehab
description: "MoviRehab - Aplicación de ejercicios de movilidad y rehabilitación articular (Proyecto 5)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.3

  # Persistencia SQLite (Bloque C)
  sqflite: ^2.3.0
  sqflite_common_ffi: ^2.3.0
  path: ^1.8.3
  path_provider: ^2.1.1

  # Interfaz Natural de Usuario - NUI (Bloque B)
  speech_to_text: ^7.5.0
  flutter_tts: ^4.2.5
  google_mlkit_pose_detection: ^0.16.1
  sensors_plus: ^7.1.1
  permission_handler: ^13.0.2

  # Navegación y estado (Bloque A)
  go_router: ^18.1.2
  provider: ^6.1.1

  # Paquete de componentes visuales propios (Bloque D)
  movirehab_components:
    path: ./packages/movirehab_components

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true