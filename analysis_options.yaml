# Configuración del analizador estático (flutter analyze / Dart en VS Code).
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - web/**
    - windows/**
    - android/**
    # Código generado por `flutter gen-l10n` (se regenera con `flutter pub get`).
    - lib/l10n/app_localizations*.dart
    - ios/**
    - linux/**

linter:
  rules:
    prefer_single_quotes: true
    avoid_print: true
    use_build_context_synchronously: true
